name: Apply Scrub Bar Object Mode fix

on:
  push:
    branches:
      - "release/7.1.11-lts"
    paths:
      - "release-patches/7.1.14-scrub-object-mode.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/7.1.11-lts
          fetch-depth: 0

      - name: Apply verified Scrub Bar patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="release-patches/7.1.14-scrub-object-mode.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm "$PATCH" .github/workflows/apply-scrub-7114.yml
          python -m compileall -q frame_by_plane
          find frame_by_plane -type d -name __pycache__ -prune -exec rm -rf {} +
          find frame_by_plane -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Scrub Bar magnet in Object Mode"
          git push origin HEAD:release/7.1.11-lts
