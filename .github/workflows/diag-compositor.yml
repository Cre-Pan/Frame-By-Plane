name: Diagnostic - compositor group_edit poll

on:
  pull_request:
    paths:
      - ".github/workflows/diag-compositor.yml"
      - "tools/diag_compositor_group_edit.py"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install UI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libx11-6 libxi6 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1
      - name: Download Blender 5.2.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz" --output "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Run diagnostic
        env:
          FBP_DIAG_SOURCE: ${{ github.workspace }}/frame_by_plane
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for editor in 0 1; do
            for fix in 0 1; do
              FBP_DIAG_EDITOR=$editor FBP_DIAG_FIX=$fix timeout 300 xvfb-run -a -s "-screen 0 1280x800x24" "$RUNNER_TEMP/blender/blender" --factory-startup --python tools/diag_compositor_group_edit.py > "diag-$editor-$fix.log" 2>&1 || true
            done
          done
          echo "==== DIAG lines ===="
          grep -H "DIAG\|FBP WARNING" diag-*.log || true
          echo "==== Python errors ===="
          grep -n -A12 "Traceback" diag-*.log || echo "no tracebacks"
