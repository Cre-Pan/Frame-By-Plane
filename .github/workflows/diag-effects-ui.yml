name: Diagnostic - new effect panels

on:
  pull_request:
    paths:
      - ".github/workflows/diag-effects-ui.yml"
      - "tools/diag_effects_ui.py"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install UI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libx11-6 libxi6 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1
      - name: Download Blender 5.2.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz" --output "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Run diagnostic
        env:
          FBP_DIAG_SOURCE: ${{ github.workspace }}/frame_by_plane
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          timeout 300 xvfb-run -a -s "-screen 0 1280x800x24" "$RUNNER_TEMP/blender/blender" --factory-startup --enable-event-simulate --python tools/diag_effects_ui.py 2>&1 | tee diag.log || true
          echo "==== DIAG lines ===="
          grep "DIAG" diag.log || true
          echo "==== Python errors ===="
          grep -n -A12 "Traceback" diag.log || echo "no tracebacks"
