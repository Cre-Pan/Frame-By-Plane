name: Apply 7.1.11 scrub patch

on:
  push:
    branches:
      - "release/7.1.11-lts"
    paths:
      - "release-patches/7.1.11-scrub.patch.part*"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/7.1.11-lts
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=(release-patches/7.1.11-scrub.patch.part*)
          if (( ${#PARTS[@]} == 0 )); then
            echo "Patch already consumed"
            exit 0
          fi
          PATCH="${RUNNER_TEMP}/7.1.11-scrub.patch"
          cat "${PARTS[@]}" > "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm -f "${PARTS[@]}"
          python tools/verify_repository.py
          python -m compileall -q frame_by_plane
          find frame_by_plane -type d -name __pycache__ -prune -exec rm -rf {} +
          find frame_by_plane -name '*.pyc' -delete

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Frame By Plane 7.1.11 scrub and frame-zero fixes"
          git push origin HEAD:release/7.1.11-lts
