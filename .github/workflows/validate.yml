name: Validate extension source

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository metadata
        run: python tools/verify_repository.py

      - name: Validate Python symbols and RNA callbacks
        run: python tools/verify_python_symbols.py

      - name: Compile Python sources
        run: python -m compileall -q frame_by_plane

      - name: Build deterministic release packages
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: python tools/build_release.py --source-dir frame_by_plane --output-dir dist-validation
