name: Validate extension source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository metadata
        run: python tools/verify_repository.py

      - name: Compile Python sources
        run: python -m compileall -q frame_by_plane

      - name: Check for undefined names
        # A name lost in a merge only fails when its dialog or code path runs.
        run: |
          python -m pip install --quiet ruff==0.14.0
          ruff check --no-cache --isolated --select F821,F822,F823 --extend-exclude frame_by_plane/wheels frame_by_plane
